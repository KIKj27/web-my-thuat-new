<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triển Lãm Mỹ Thuật Online</title>
    <style>
        :root { --primary: #4F46E5; --bg: #F3F4F6; --card: #FFFFFF; --text: #1F2937; }
        .dark-mode { --bg: #111827; --card: #1F2937; --text: #F9FAFB; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: all 0.3s; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #CCC; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: #EF4444; }
        .btn-warning { background: #F59E0B; }
        .btn-sm { width: auto; padding: 4px 8px; font-size: 12px; margin-left: 5px; display: inline-block; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; }
        .badge-admin { background: #DC2626; }
        .badge-teacher { background: #059669; }
        .post { border-bottom: 1px solid #E5E7EB; padding-bottom: 15px; margin-bottom: 15px; }
        .post img { max-width: 100%; border-radius: 8px; margin-top: 10px; max-height: 400px; object-fit: contain; }
        .comment-pinned { background: #FEF3C7; border-left: 4px solid #F59E0B; padding: 8px; border-radius: 4px; margin-top: 5px; color: #1F2937; }
        .chat-box { height: 180px; overflow-y: auto; border: 1px solid #DDD; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.02); }
        .hidden { display: none; }
        .auth-box { display: flex; gap: 15px; flex-wrap: wrap; }
        .auth-col { flex: 1; min-width: 280px; border: 1px solid #E5E7EB; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="card header">
        <h2>🎨 Triển Lãm Mỹ Thuật</h2>
        <div>
            <button onclick="toggleDarkMode()" style="width: auto;">🌙 Đổi Giao Diện</button>
            <span id="userInfo"></span>
            <button id="btnLogout" class="btn-sm btn-danger hidden" onclick="logout()">Đăng Xuất</button>
        </div>
    </div>

    <!-- Khung Đăng Nhập / Đăng Ký -->
    <div id="authCard" class="card auth-box">
        <div class="auth-col">
            <h3>🔑 Đăng Nhập</h3>
            <p style="font-size: 12px; color: gray;">Admin: ADMIN / 14121277<br>Giáo Viên: GIÁO VIÊN / 77089</p>
            <input type="text" id="loginUser" placeholder="Tên đăng nhập...">
            <input type="password" id="loginPass" placeholder="Mật khẩu...">
            <button onclick="login()">Đăng Nhập</button>
        </div>
        <div class="auth-col">
            <h3>📝 Tạo Tài Khoản Học Sinh</h3>
            <input type="text" id="regUser" placeholder="Tên đăng ký mới...">
            <input type="password" id="regPass" placeholder="Mật khẩu mới...">
            <button onclick="register()" style="background: #059669;">Đăng Ký</button>
        </div>
    </div>

    <!-- Nội dung chính khi đã đăng nhập -->
    <div id="mainContent" class="hidden">
        
        <!-- Bảng quản lý cho Admin -->
        <div id="adminPanel" class="card hidden">
            <h3 style="color: #DC2626;">⚙️ Bảng Quản Lý Người Dùng (Admin)</h3>
            <div id="userList"></div>
        </div>

        <!-- Khung Đăng Tác Phẩm & Ảnh -->
        <div class="card">
            <h3>🖼️ Đăng Tác Phẩm Mỹ Thuật</h3>
            <input type="text" id="postTitle" placeholder="Tiêu đề tác phẩm...">
            <textarea id="postContent" rows="2" placeholder="Mô tả tác phẩm..."></textarea>
            <label style="display:block; margin-top:8px; font-weight:bold; font-size:14px;">Chọn ảnh bức tranh:</label>
            <input type="file" id="postImage" accept="image/*">
            <button onclick="createPost()">Đăng Bài Lên Triển Lãm</button>
        </div>

        <!-- Danh sách bài viết -->
        <div class="card">
            <h3>🎨 Tranh & Bài Viết Của Học Sinh</h3>
            <div id="postList">Chưa có bài viết nào.</div>
        </div>

        <!-- Khung Chat -->
        <div class="card">
            <h3>💬 Phòng Chat Chung</h3>
            <div id="chatBox" class="chat-box"></div>
            <input type="text" id="chatMsg" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">Gửi Tin Nhắn</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let posts = JSON.parse(localStorage.getItem('posts')) || [];
    let chats = JSON.parse(localStorage.getItem('chats')) || [];
    let users = JSON.parse(localStorage.getItem('users')) || [
        { name: 'KIK', pass: '123', role: 'student', banned: false }
    ];

    function register() {
        const u = document.getElementById('regUser').value.trim();
        const p = document.getElementById('regPass').value.trim();
        if (!u || !p) return alert('Vui lòng nhập đầy đủ tên và mật khẩu để đăng ký!');

        const exists = users.find(x => x.name.toLowerCase() === u.toLowerCase());
        if (exists) return alert('Tên đăng nhập này đã tồn tại!');

        users.push({ name: u, pass: p, role: 'student', banned: false });
        saveData();
        alert('Đăng ký thành công! Hãy dùng tài khoản vừa tạo để đăng nhập.');
        document.getElementById('regUser').value = '';
        document.getElementById('regPass').value = '';
    }

    function login() {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        if (!u) return alert('Vui lòng nhập tên đăng nhập!');

        if (u === 'ADMIN' && p === '14121277') {
            currentUser = { name: 'ADMIN', role: 'admin' };
        } else if (u === 'GIÁO VIÊN' && p === '77089') {
            currentUser = { name: 'GIÁO VIÊN', role: 'teacher' };
        } else {
            const found = users.find(x => x.name.toLowerCase() === u.toLowerCase());
            if (!found) return alert('Tài khoản không tồn tại! Vui lòng đăng ký trước ở khung bên cạnh.');
            if (found.banned) return alert('Tài khoản này đã bị Ban!');
            if (found.pass !== p) return alert('Mật khẩu không chính xác!');
            currentUser = { name: found.name, role: found.role };
        }

        document.getElementById('authCard').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('btnLogout').classList.remove('hidden');

        updateUserUI();
        renderAdminPanel();
        renderPosts();
        renderChats();
    }

    function logout() {
        currentUser = null;
        document.getElementById('authCard').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('btnLogout').classList.add('hidden');
        document.getElementById('userInfo').innerText = '';
    }

    function updateUserUI() {
        let roleBadge = '';
        if (currentUser.role === 'admin') roleBadge = ' <span class="badge badge-admin">ADMIN</span>';
        if (currentUser.role === 'teacher') roleBadge = ' <span class="badge badge-teacher">GIÁO VIÊN</span>';
        document.getElementById('userInfo').innerHTML = `Chào, <b>${currentUser.name}</b>${roleBadge}`;
        
        if (currentUser.role === 'admin') {
            document.getElementById('adminPanel').classList.remove('hidden');
        } else {
            document.getElementById('adminPanel').classList.add('hidden');
        }
    }

    function renderAdminPanel() {
        if (currentUser?.role !== 'admin') return;
        const div = document.getElementById('userList');
        div.innerHTML = users.map((u, i) => `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px; align-items:center; background:rgba(0,0,0,0.03); padding:5px; border-radius:4px;">
                <span><b>${u.name}</b> (${u.role}) ${u.banned ? '<b style="color:red">[BANNED]</b>' : ''}</span>
                <div>
                    <button class="btn-sm btn-warning" onclick="toggleBan(${i})">${u.banned ? 'Unban' : 'Ban'}</button>
                    <button class="btn-sm btn-danger" onclick="deleteUser(${i})">Xóa</button>
                </div>
            </div>
        `).join('');
    }

    function toggleBan(index) {
        users[index].banned = !users[index].banned;
        saveData();
        renderAdminPanel();
    }

    function deleteUser(index) {
        users.splice(index, 1);
        saveData();
        renderAdminPanel();
    }

    function createPost() {
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const fileInput = document.getElementById('postImage');
        if (!title || !content) return alert('Vui lòng nhập tiêu đề và mô tả bài viết!');

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                savePostData(title, content, e.target.result);
            }
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            savePostData(title, content, null);
        }
    }

    function savePostData(title, content, image) {
        posts.unshift({
            id: Date.now(),
            author: currentUser.name,
            title, content, image,
            score: null, review: '',
            comments: []
        });
        saveData();
        renderPosts();
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        document.getElementById('postImage').value = '';
    }

    function renderPosts() {
        const div = document.getElementById('postList');
        if (posts.length === 0) { div.innerHTML = 'Chưa có bài viết nào.'; return; }

        div.innerHTML = posts.map((p, i) => `
            <div class="post">
                <h4>${p.title} <small style="color:gray">bởi ${p.author}</small></h4>
                <p>${p.content}</p>
                ${p.image ? `<img src="${p.image}" alt="Tác phẩm mỹ thuật">` : ''}

                <!-- Chấm điểm của Giáo viên -->
                ${p.score !== null ? `<div style="background:#E0F2FE; padding:8px; border-radius:6px; margin:8px 0;">
                    <b>💯 Điểm số: ${p.score}/10</b> | <b>Đánh giá của Cô:</b> ${p.review}
                </div>` : ''}

                ${currentUser.role === 'teacher' ? `
                    <div style="background:#F3F4F6; padding:8px; border-radius:6px; margin:5px 0;">
                        <input type="number" id="score-${i}" placeholder="Điểm (1-10)..." min="1" max="10" style="width:110px; display:inline-block;">
                        <input type="text" id="review-${i}" placeholder="Nhận xét của cô..." style="width:230px; display:inline-block;">
                        <button class="btn-sm" onclick="gradePost(${i})">Chấm Điểm</button>
                    </div>
                ` : ''}

                <!-- Xóa bài cho Admin -->
                ${currentUser.role === 'admin' ? `<button class="btn-sm btn-danger" onclick="deletePost(${i})" style="margin-top:8px;">Xóa Bài Viết</button>` : ''}

                <!-- Bình luận -->
                <div style="margin-top:10px;">
                    <h5>Bình luận & Đánh giá:</h5>
                    ${p.comments.map((c, ci) => `
                        <div class="${c.pinned ? 'comment-pinned' : ''}" style="margin-bottom:4px; padding:4px;">
                            ${c.pinned ? '📌 <b>[Được ghim]</b> ' : ''}<b>${c.author}:</b> ${c.text}${(currentUser.role === 'admin' || currentUser.role === 'teacher') ? `
                                <button class="btn-sm btn-warning" onclick="togglePinComment(${i}, ${ci})">${c.pinned ? 'Bỏ ghim' : 'Ghim'}</button>
                            ` : ''}
                            ${currentUser.role === 'admin' ? `<button class="btn-sm btn-danger" onclick="deleteComment(${i}, ${ci})">Xóa</button>` : ''}
                        </div>
                    `).join('')}
                    <input type="text" id="cmt-${i}" placeholder="Viết bình luận..." onkeydown="if(event.key==='Enter') addComment(${i})">
                    <button class="btn-sm" onclick="addComment(${i})">Gửi</button>
                </div>
            </div>
        `).join('');
    }

    function gradePost(index) {
        const score = document.getElementById(`score-${index}`).value;
        const review = document.getElementById(`review-${index}`).value;
        if (!score) return alert('Vui lòng nhập điểm số!');

        posts[index].score = score;
        posts[index].review = review;
        saveData();
        renderPosts();
    }

    function deletePost(index) {
        posts.splice(index, 1);
        saveData();
        renderPosts();
    }

    function addComment(postIndex) {
        const txt = document.getElementById(`cmt-${postIndex}`).value.trim();
        if (!txt) return;

        posts[postIndex].comments.push({ author: currentUser.name, text: txt, pinned: false });
        saveData();
        renderPosts();
    }

    function deleteComment(postIndex, commentIndex) {
        posts[postIndex].comments.splice(commentIndex, 1);
        saveData();
        renderPosts();
    }

    function togglePinComment(postIndex, commentIndex) {
        const cmt = posts[postIndex].comments[commentIndex];
        cmt.pinned = !cmt.pinned;
        posts[postIndex].comments.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
        saveData();
        renderPosts();
    }

    function sendChat() {
        const msg = document.getElementById('chatMsg').value.trim();
        if (!msg) return;

        chats.push({ author: currentUser.name, text: msg, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        saveData();
        renderChats();
        document.getElementById('chatMsg').value = '';
    }

    function renderChats() {
        const div = document.getElementById('chatBox');
        div.innerHTML = chats.map(c => `<div><i>[${c.time}]</i> <b>${c.author}:</b> ${c.text}</div>`).join('');
        div.scrollTop = div.scrollHeight;
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }

    function saveData() {
        localStorage.setItem('posts', JSON.stringify(posts));
        localStorage.setItem('chats', JSON.stringify(chats));
        localStorage.setItem('users', JSON.stringify(users));
    }
</script>
</body>
</html>
